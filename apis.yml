aid: polar-sh
url: https://raw.githubusercontent.com/api-evangelist/polar-sh/refs/heads/main/apis.yml
name: Polar
kind: company
description: Polar is an open-source, developer-first monetization platform that acts
  as a Merchant of Record (MoR), handling billing, payments, and global sales tax so
  software teams can sell digital products, subscriptions, usage-based billing, and
  license keys. The Polar API (https://api.polar.sh/v1) exposes products, prices,
  checkouts, customers, subscriptions, orders, benefits, license keys, a customer
  portal, usage meters/events, and webhooks behind Bearer organization access tokens.
  Not affiliated with Polar Electro (fitness wearables) or the Polaris design system.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/polar-sh.png
