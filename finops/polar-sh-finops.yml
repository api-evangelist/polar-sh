description: >-
  FinOps view of Polar as a Merchant of Record. Because Polar sells on the
  developer's behalf, "spend" is the set of fees Polar deducts from gross
  sales - a base Merchant of Record transaction fee (percentage + fixed),
  international card surcharges, dispute fees, and Stripe-based payout fees -
  netted against revenue before payout. Tiered monthly plans trade a fixed
  monthly fee for a lower variable rate.
notes: >-
  Fee schedule verified against Polar pricing and Merchant of Record fees pages
  on 2026-06-21; rates change. Verify against the pricing page at reconciliation.
sources:
- https://polar.sh/resources/pricing
- https://polar.sh/docs/merchant-of-record/fees
- https://focus.finops.org/focus-specification/v1-3/
