meters:
- name: transaction_fee_percent
  description: Percentage component of the Merchant of Record fee on each transaction (4-5% depending on plan).
  unit: percent
  aggregation: sum
  dimensions:
  - organization
  - plan
- name: transaction_fee_fixed
  description: Fixed per-transaction component of the Merchant of Record fee ($0.30-$0.50 depending on plan).
  unit: transactions
  aggregation: sum
  dimensions:
  - organization
  - plan
- name: subscription_surcharge
  description: Additional 0.5% on subscription payments for Early Member (grandfathered) organizations.
  unit: percent
  aggregation: sum
  dimensions:
  - organization
- name: international_card_surcharge
  description: Additional 1.5% applied to transactions paid with an international card.
  unit: percent
  aggregation: sum
  dimensions:
  - organization
- name: dispute_fee
  description: Flat $15 charged per dispute/chargeback regardless of outcome.
  unit: disputes
  aggregation: sum
  dimensions:
  - organization
- name: payout_fee
  description: Stripe payout fees - 0.25% + $0.25 per payout, $2 per active payout month, plus cross-border conversion fees.
  unit: payouts
  aggregation: sum
  dimensions:
  - organization
- name: monthly_platform_fee
  description: Fixed monthly plan fee ($0 Starter, $20 Pro, $100 Growth, $400 Scale).
  unit: months
  aggregation: sum
  dimensions:
  - organization
  - plan
principles:
- name: Visibility
  description: Reconcile gross sales against Polar fees in the dashboard and via the Orders / Subscriptions export and webhook events.
- name: Allocation
  description: Tag products and use customer external IDs and metadata to map fees and revenue to internal cost centers and teams.
- name: Optimization
  description: Move to a higher monthly plan once sales clear its breakeven (Pro ~$1,379, Growth ~$5,634, Scale ~$19,048 per month) to lower the variable rate; batch payouts to reduce per-payout fees.
- name: Accountability
  description: Review net-of-fee revenue monthly per product and per plan, and monitor dispute rates to control $15 dispute fees.
maintainers:
